name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v3 attempted to install the REMOVED Android SDK package "tools".
      # v4 with an explicit empty package list installs only command-line tools
      # and configures the SDK; packages below are installed separately.
      - name: Set up Android SDK without deprecated tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0'
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          test -f "$SDK_ROOT/platforms/android-34/android.jar"
          test -x "$SDK_ROOT/build-tools/34.0.0/aapt2"
          echo "Android SDK 34 / Build Tools 34.0.0 ready at $SDK_ROOT"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/build.gradle
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HAVANHHUAN-Booster-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
